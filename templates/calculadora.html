<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #333; /* Fondo oscuro para resaltar el texto blanco */
        }
        p {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 20px; /* Espacio entre el texto y la calculadora */
            text-align: center;
        }
        fieldset {
            border: none;
        }
    </style>
</head>

<body>
    <p>Calculadora</p>
    <fieldset>
        <form action="{{url_for('calculadora')}}" method="POST">
            <input type="text" name="pantalla" id="pantalla" readonly>
            <div class="botones">
                <input type="button" value="7" onclick="agregar('7')">
                <input type="button" value="8" onclick="agregar('8')">
                <input type="button" value="9" onclick="agregar('9')">
                <input type="button" value="/" onclick="agregar('/')">
                <input type="button" value="4" onclick="agregar('4')">
                <input type="button" value="5" onclick="agregar('5')">
                <input type="button" value="6" onclick="agregar('6')">
                <input type="button" value="*" onclick="agregar('*')">
                <input type="button" value="1" onclick="agregar('1')">
                <input type="button" value="2" onclick="agregar('2')">
                <input type="button" value="3" onclick="agregar('3')">
                <input type="button" value="-" onclick="agregar('-')">
                <input type="button" value="0" onclick="agregar('0')">
                <input type="button" value="." onclick="agregar('.')">
                <input type="button" value="C" onclick="limpiar()">
                <input type="button" value="+" onclick="agregar('+')">
                <input type="submit" value="=" onclick="calcular(); return false;">
            </div>
        </form>
    </fieldset>
    <script src="{{url_for('static', filename='js/pantalla.js')}}"></script>
</body>

</html>
